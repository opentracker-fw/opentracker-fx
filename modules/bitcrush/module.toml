# OpenTracker module manifest (core: docs/PLAN_3X.md §7.2, tools/profile.py).
id      = "CRSH"
name    = "Bitcrush"
version = "1.0.0"
api     = 1
entry   = "bitcrushModule"              # ot::mod::IModule& ot::mod::bitcrushModule()
caps    = ["effect"]
effects = ["CRSH"]                      # per-instance effects (IModule::effect)
sources = ["bitcrush.cpp", "bitcrush_module.cpp"]
tests   = ["bitcrush_test.cpp"]

flash_max_bytes   = 1600
sram_audio_bytes  = 0                 # no buffers
